<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellitas Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Oranienbaum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login" id="login" hidden>
  <form class="login__box" id="loginForm">
    <img src="../assets/img/logo.png" alt="Wellitas" class="login__logo">
    <h1>Store admin</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="b b--primary">Log in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a href="#/" class="side__brand"><img src="../assets/img/logo.png" alt="Wellitas"><span>Admin</span></a>
    <nav class="side__nav">
      <a href="#/" data-nav="home"><i>⌂</i>Home</a>
      <a href="#/orders" data-nav="orders"><i>▤</i>Orders <b id="navOrders"></b></a>
      <a href="#/products" data-nav="products"><i>◫</i>Products</a>
      <a href="#/inventory" data-nav="inventory"><i>▦</i>Inventory <b id="navStock"></b></a>
      <a href="#/customers" data-nav="customers"><i>☺</i>Customers</a>
      <a href="#/checkouts" data-nav="checkouts"><i>⧗</i>Abandoned carts <b id="navAbandoned"></b></a>
      <p class="side__label">Grow</p>
      <a href="#/discounts" data-nav="discounts"><i>%</i>Discounts</a>
      <a href="#/marketing" data-nav="marketing"><i>✦</i>Marketing</a>
      <a href="#/reports" data-nav="reports"><i>▲</i>Reports</a>
      <p class="side__label">Store</p>
      <a href="#/settings" data-nav="settings"><i>⚙</i>Settings</a>
      <a href="../index.html" target="_blank" rel="noopener"><i>↗</i>View store</a>
    </nav>
    <div class="side__me"><span id="meName"></span><button class="link" id="logout">Log out</button></div>
  </aside>
  <div class="main">
    <header class="top"><button class="b b--ghost menu-btn" id="sideToggle" aria-label="Menu">☰</button><div id="crumbs"></div><div id="modeBadge"></div></header>
    <div class="banner" id="payBanner" hidden></div>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal__box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
